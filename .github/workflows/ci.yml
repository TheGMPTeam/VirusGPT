name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax-check all Python sources
        run: |
          echo "::group::py_compile"
          # Fail the build on the first syntax error; report each file.
          status=0
          while IFS= read -r f; do
            python -m py_compile "$f" || { echo "SYNTAX ERROR: $f"; status=1; }
          done < <(find . -type f -name "*.py" \
                      -not -path "./.venv/*" \
                      -not -path "./whisper/*" \
                      -not -path "./data/*" \
                      -not -path "*/.venv/*" \
                      -not -path "*/__pycache__/*")
          echo "::endgroup::"
          exit $status

      - name: Verify requirements.txt installs cleanly
        run: |
          python -m venv ci-venv
          ./ci-venv/bin/pip install -q --upgrade pip
          ./ci-venv/bin/pip install -q -r requirements.txt
          echo "requirements.txt installed OK"

      - name: Validate JSON config files
        run: |
          for j in config.json; do
            [ -f "$j" ] && python -c "import json,sys; json.load(open('$j')); print('$j valid')"
          done

      - name: Static lint (pyflakes)
        run: |
          python -m pip install -q pyflakes
          # Fail on any undefined name / unused import in the core codebase
          # (vendored pockettts/, whisper/ and .venv are excluded).
          status=0
          python -m pyflakes server.py vgctl.py desktop services autonomous gateway memory tools \
            || status=1
          exit $status

      - name: Audit STATUS.md against the code
        run: |
          # scripts/audit_status.py is stdlib-only. It fails the build if
          # docs/STATUS.md's 🔴/🟡/✅ matrix contradicts real files/routes,
          # so the feature matrix cannot silently drift out of sync.
          python scripts/audit_status.py
