<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="VirusGPT logo">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#07241b"/>
      <stop offset="100%" stop-color="#03110c"/>
    </radialGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff9c"/>
      <stop offset="55%" stop-color="#23e0ff"/>
      <stop offset="100%" stop-color="#ff2bd6"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g filter="url(#soft)" stroke="url(#glow)" stroke-width="16" stroke-linecap="round" fill="none">
    <!-- 12 virus spikes radiating from center -->
    <g transform="translate(256 256)">
      <circle r="74" fill="#04130d" stroke="url(#glow)" stroke-width="14"/>
      <g>
        <line x1="0" y1="-74" x2="0" y2="-132"/>
        <line x1="0" y1="74" x2="0" y2="132"/>
        <line x1="-74" y1="0" x2="-132" y2="0"/>
        <line x1="74" y1="0" x2="132" y2="0"/>
        <line x1="-52" y1="-52" x2="-93" y2="-93"/>
        <line x1="52" y1="52" x2="93" y2="93"/>
        <line x1="-52" y1="52" x2="-93" y2="93"/>
        <line x1="52" y1="-52" x2="93" y2="-93"/>
        <line x1="0" y1="-74" x2="42" y2="-118" transform="rotate(22)"/>
        <line x1="0" y1="-74" x2="42" y2="-118" transform="rotate(-22)"/>
        <line x1="0" y1="74" x2="42" y2="118" transform="rotate(22)"/>
        <line x1="0" y1="74" x2="42" y2="118" transform="rotate(-22)"/>
      </g>
      <!-- spike tips -->
      <g fill="url(#glow)" stroke="none">
        <circle cx="0" cy="-132" r="11"/><circle cx="0" cy="132" r="11"/>
        <circle cx="-132" cy="0" r="11"/><circle cx="132" cy="0" r="11"/>
        <circle cx="-93" cy="-93" r="11"/><circle cx="93" cy="93" r="11"/>
        <circle cx="-93" cy="93" r="11"/><circle cx="93" cy="-93" r="11"/>
        <circle cx="54" cy="-100" r="9"/><circle cx="-54" cy="100" r="9" transform="rotate(0)"/>
        <circle cx="-54" cy="-100" r="9"/><circle cx="54" cy="100" r="9"/>
      </g>
    </g>
  </g>
  <text x="256" y="470" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="58" font-weight="700" fill="#eafff5" letter-spacing="2">VirusGPT</text>
</svg>
